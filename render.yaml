services:
  - type: web
    name: deep-researcher-agent
    env: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        value: sqlite:///app/deep_researcher.db?mode=rwc
      - key: LLM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: LLM_MODEL
        value: meta/llama-3.1-70b-instruct
      - key: LLM_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: MAX_RAM_PERCENT
        value: "85.0"
      - key: MAX_CONCURRENT_JOBS
        value: "5"
      - key: MAX_RESEARCH_CONCURRENCY
        value: "3"
