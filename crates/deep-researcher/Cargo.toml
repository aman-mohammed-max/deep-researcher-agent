[package]
name = "deep-researcher-agent"
version = "0.1.0"
edition = "2021"
authors = ["Deep Researcher Team"]
description = "High-performance enterprise AI research agent in Rust"

[dependencies]
# Async Runtime & Networking
tokio = { version = "1.43", features = ["full"] }
tokio-stream = "0.1"
async-stream = "0.3"
axum = { version = "0.8", features = ["ws", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
async-trait = "0.1"

# Serialization & Templating
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
minijinja = { version = "2.7", features = ["loader", "json"] }

# Database & Checkpointing
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "migrate"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Embedded Frontend
rust-embed = { version = "8.5", features = ["mime-guess"] }
mime_guess = "2.0"

# Observability & Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration & Utilities
dotenvy = "0.15"
regex = "1.11"
urlencoding = "2.1"


