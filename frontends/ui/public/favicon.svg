<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76b900"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background tile with smooth squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Radar / Multi-Agent Scanning Rings -->
  <circle cx="32" cy="32" r="22" stroke="#10b981" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="32" cy="32" r="14" stroke="#76b900" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Central Autonomous Intelligence Nexus -->
  <g filter="url(#glow)">
    <!-- Central diamond node -->
    <path d="M32 18 L42 32 L32 46 L22 32 Z" fill="url(#brand-grad)" fill-opacity="0.9"/>
    
    <!-- Core pulse spark -->
    <circle cx="32" cy="32" r="4.5" fill="#ffffff"/>
  </g>

  <!-- Orbital Researcher Worker Nodes -->
  <circle cx="32" cy="10" r="2.5" fill="#76b900"/>
  <circle cx="54" cy="32" r="2.5" fill="#10b981"/>
  <circle cx="32" cy="54" r="2.5" fill="#06b6d4"/>
  <circle cx="10" cy="32" r="2.5" fill="#10b981"/>
</svg>
